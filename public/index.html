<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZiyuanClub</title>
  <link rel="icon" type="image/jpeg" href="/image/logo.jpg?v=1">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <div id="nav-host"></div>
  <main class="page">
    <section class="hero" id="hero">
      <button class="hero-tip" id="heroTipBtn" type="button" style="display:none;">TIP</button>
      <h1>畅享预充值购物</h1>
      <p>预存余额，一键下单。后台托管，安全可靠。下单即时扣款，无需等待在线支付。</p>
      <a class="balance-chip" id="balanceChip" href="/user" style="display:none;">
        当前余额：$<b id="heroBalance">0.00</b>
      </a>
    </section>

    <h2 class="page-title" style="margin-bottom: var(--space-4);">在售商品</h2>
    <div class="cat-tabs" style="margin-bottom: var(--space-4);" id="catTabs"></div>
    <div class="products-grid" id="grid"></div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    mountNav('home');

    let products = [];
    let categories = [];
    let activeCat = 0; // 0 表示全部

    // 首屏骨架屏：先占位避免空白与布局跳动
    function renderSkeletonCards() {
      const grid = document.getElementById('grid');
      grid.innerHTML = Array.from({ length: 8 }).map(() => `
        <article class="product-card">
          <div class="skeleton skeleton-cover"></div>
          <div class="product-body">
            <div class="skeleton" style="height:16px;width:52px;border-radius:999px;margin-bottom:8px;"></div>
            <div class="skeleton" style="height:15px;width:70%;margin-bottom:8px;"></div>
            <div class="skeleton" style="height:12px;width:90%;margin-bottom:16px;"></div>
            <div class="skeleton" style="height:16px;width:42%;"></div>
          </div>
        </article>
      `).join('');
    }

    // 余额芯片骨架占位：登录用户先占位，避免余额加载后芯片弹出导致页面跳动
    function renderBalanceSkeleton() {
      if (!API.getToken()) return; // 未登录不占位
      const chip = document.getElementById('balanceChip');
      chip.style.display = 'inline-flex';
      chip.innerHTML = '<span class="skeleton" style="height:18px;width:120px;border-radius:999px;"></span>';
    }

    async function loadAll() {
      // 商品 + 分类 + 余额（如已登录）
      // 分类未返回前先渲染“全部”，防止标签出现时页面跳动
      document.getElementById('catTabs').innerHTML =
        '<button class="cat-tab active" data-cat="0">全部</button>';
      renderSkeletonCards();
      renderBalanceSkeleton();
      const [prodRes, catRes] = await Promise.all([
        API.get('/api/products'),
        API.get('/api/products/categories').catch(() => ({ data: [] }))
      ]);

      if (prodRes.code === 0) {
        products = prodRes.data || [];
        renderProducts();
      } else {
        Toast.error('商品加载失败');
      }

      if (catRes && catRes.code === 0) {
        categories = catRes.data || [];
        renderCats();
      }

      if (API.getToken()) {
        const chip = document.getElementById('balanceChip');
        try {
          const bal = await API.get('/api/user/balance');
          if (bal.code === 0) {
            chip.innerHTML = `当前余额<b id="heroBalance">$${fmt.money(bal.data.amount)}</b>`;
          } else {
            chip.style.display = 'none';
          }
        } catch (e) {
          chip.style.display = 'none';
        }
      }
    }

    function renderCats() {
      const host = document.getElementById('catTabs');
      const list = [{ id: 0, name: '全部' }, ...categories];
      host.innerHTML = list.map((c) =>
        `<button class="cat-tab ${activeCat === c.id ? 'active' : ''}" data-cat="${c.id}">${escapeHtml(c.name)}</button>`
      ).join('');
      host.querySelectorAll('[data-cat]').forEach((b) => {
        b.addEventListener('click', () => {
          activeCat = Number(b.dataset.cat);
          host.querySelectorAll('[data-cat]').forEach((x) => x.classList.toggle('active', Number(x.dataset.cat) === activeCat));
          renderProducts();
        });
      });
    }

    function renderProducts() {
      const grid = document.getElementById('grid');
      const shown = activeCat > 0 ? products.filter((p) => p.category_id === activeCat) : products;
      if (!shown.length) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">
          <div class="empty-icon">📦</div>
          暂无在售商品${activeCat > 0 ? '（该分类下为空）' : ''}
        </div>`;
        return;
      }
      grid.innerHTML = shown.map((p) => {
        const hasSpec = p.specJson && Object.keys(p.specJson).length > 0;
        const stock = Number(p.stock) || 0;
        const stockLabel = hasSpec ? (stock > 0 ? `多规格·库存 ${stock}` : '多规格·已售罄') : (stock > 0 ? `库存 ${stock}` : '已售罄');
        const priceLabel = `$${fmt.money(p.price)}`;
        const btnText = stock > 0 ? (hasSpec ? '选规格购买' : '立即购买') : '缺货';
        return `
        <article class="product-card">
          <div class="product-cover">${escapeHtml(p.name.slice(0, 2) || '商品')}</div>
          <div class="product-body">
            ${p.category_name ? `<span class="product-cat">${escapeHtml(p.category_name)}</span>` : ''}
            ${hasSpec ? `<span class="product-cat" style="background:var(--c-primary);color:#fff;">多规格</span>` : ''}
            <h3 class="product-name">${escapeHtml(p.name)}</h3>
            <p class="product-desc">${escapeHtml(p.description || '暂无描述')}</p>
            <div class="product-foot">
              <div>
                <div class="product-price">${priceLabel}</div>
                <div class="product-stock ${stock <= 0 ? 'out' : ''}">${stockLabel}</div>
              </div>
              <button class="btn btn-primary btn-sm" data-buy="${p.id}" ${stock <= 0 ? 'disabled' : ''}>
                ${btnText}
              </button>
            </div>
          </div>
        </article>
      `}).join('');
      grid.querySelectorAll('[data-buy]').forEach((b) => {
        b.addEventListener('click', () => onBuy(Number(b.dataset.buy)));
      });
    }

    // 规格选择面板：返回 specDesc 字符串（如 "颜色:红 尺码:S"）或 null（取消）
    function openSpecPicker(product) {
      return new Promise((resolve) => {
        const dims = Object.entries(product.specJson || {}).map(([name, values]) => ({ name, values }));
        const selected = {};

        const m = Modal.open({
          title: `选择规格 · ${escapeHtml(product.name)}`,
          body: `<div id="skuBox"></div>`,
          footer: `<button class="btn btn-ghost" data-act="cancel">取消</button>
                   <button class="btn btn-primary" data-act="ok" disabled>确认选择</button>`
        });
        const box = m.el.querySelector('#skuBox');
        const okBtn = m.el.querySelector('[data-act=ok]');
        m.el.querySelector('[data-act=cancel]').addEventListener('click', () => { m.close(); resolve(null); });

        function render() {
          box.innerHTML = dims.map((dim) => `
            <div class="sku-dim">
              <div class="sku-dim-name">${escapeHtml(dim.name)}</div>
              <div class="sku-dim-values">
                ${dim.values.map((v) => {
                  const active = selected[dim.name] === v ? 'active' : '';
                  return `<button class="cat-tab ${active}" data-dim="${escapeHtml(dim.name)}" data-val="${escapeHtml(v)}">${escapeHtml(v)}</button>`;
                }).join('')}
              </div>
            </div>
          `).join('') + `<div class="sku-summary" id="skuSummary"></div>`;

          box.querySelectorAll('[data-dim]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const d = btn.dataset.dim, v = btn.dataset.val;
              if (selected[d] === v) delete selected[d]; else selected[d] = v;
              render();
            });
          });

          const allChosen = dims.every((d) => selected[d.name]);
          const summary = box.querySelector('#skuSummary');
          if (!allChosen) {
            summary.innerHTML = `<div style="color:var(--c-muted);font-size:13px;">请选择完整规格</div>`;
            okBtn.disabled = true;
            okBtn.onclick = null;
            return;
          }
          const desc = dims.map((d) => `${d.name}:${selected[d.name]}`).join(' ');
          summary.innerHTML = `
            <div class="sku-info">
              <span>已选：</span><b style="color:var(--c-text);">${escapeHtml(desc)}</b>
            </div>`;
          okBtn.disabled = false;
          okBtn.onclick = () => { m.close(); resolve(desc); };
        }
        render();
      });
    }

    async function onBuy(pid) {
      if (!(await requireLogin())) return;
      const p = products.find((x) => x.id === pid);
      if (!p) return;

      const hasSpec = p.specJson && Object.keys(p.specJson).length > 0;
      let specDesc = null;
      if (hasSpec) {
        specDesc = await openSpecPicker(p);
        if (!specDesc) return;
      }

      const showName = specDesc ? `${p.name}（${specDesc}）` : p.name;
      const payAmount = p.price;

      const confirmOk = await Modal.confirm({
        title: '确认下单',
        content: `
          <div style="display:flex;flex-direction:column;gap:3px;">
            <div><b>商品：</b>${escapeHtml(showName)}</div>
            <div><b>描述：</b>${escapeHtml(p.description || '暂无描述')}</div>
            <div><b>单价：</b>$${fmt.money(payAmount)}</div>
            <div><b>实付：</b><span style="color:var(--c-primary);font-weight:700;font-size:18px;">$${fmt.money(payAmount)}</span></div>
            <div style="color:var(--c-muted);font-size:13px;">下单即时从余额扣除</div>
          </div>
        `,
        okText: '确认支付',
        okClass: 'btn-primary'
      });
      if (!confirmOk) return;

      const idem = 'web_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      const payload = { productId: pid, idempotencyKey: idem };
      if (specDesc) payload.specDesc = specDesc;
      const json = await API.post('/api/orders', payload);
      if (json.code === 0) {
        Toast.success('下单成功！');
        setTimeout(() => location.reload(), 800);
      } else if (json.code === 1006) {
        Toast.error('余额不足，请联系管理员充值');
      } else if (json.code === 1007) {
        Toast.error('库存不足');
      } else if (json.code === 1005) {
        Toast.warn('请勿重复提交');
      } else if (json.code === 1001) {
        Toast.warn(json.message || '请选择商品规格');
      } else {
        Toast.error(json.message || '下单失败');
      }
    }

    // ===== 首页弹窗 =====
    let hpCfg = null;
    function showHomePopup() {
      if (!hpCfg) return;
      const img = hpCfg.imageUrl
        ? `<img src="${escapeHtml(hpCfg.imageUrl)}" alt="popup" style="width:100%;max-height:240px;object-fit:cover;display:block;border-radius:12px 12px 0 0;">`
        : '';
      const m = Modal.open({
        title: escapeHtml(hpCfg.title || '公告'),
        body: `${img}<div class="hp-rich" style="font-size:14px;line-height:1.7;color:var(--c-text);max-height:44vh;overflow-y:auto;">${hpCfg.content || ''}</div>`,
        footer: `<button class="btn btn-primary" data-act="ok">我知道了</button>`
      });
      m.el.querySelector('[data-act=ok]').addEventListener('click', () => m.close());
    }
    async function initHomePopup() {
      const tipBtn = document.getElementById('heroTipBtn');
      try {
        const r = await API.get('/api/home-popup');
        if (r.code === 0) hpCfg = r.data;
      } catch (e) { hpCfg = null; }
      if (!hpCfg || Number(hpCfg.enabled) !== 1) {
        // 后台未启用弹窗：隐藏 TIP 按钮
        if (tipBtn) tipBtn.style.display = 'none';
        return;
      }
      tipBtn.addEventListener('click', showHomePopup);
      // 显示 TIP 按钮
      if (tipBtn) tipBtn.style.display = 'block';
      // 检查是否已弹出过
      if (localStorage.getItem('hp_shown')) return;
      const mode = hpCfg.triggerMode || 'first';
      if (mode === 'first') {
        if (localStorage.getItem('hp_shown')) return;
        localStorage.setItem('hp_shown', '1');
      } else if (mode === 'timer') {
        const interval = (Number(hpCfg.intervalMinutes) || 30) * 60000;
        const last = Number(localStorage.getItem('hp_last') || 0);
        if (Date.now() - last < interval) return;
        localStorage.setItem('hp_last', String(Date.now()));
      }
      // refresh 模式或满足条件的 first/timer -> 弹出
      showHomePopup();
    }

    loadAll();
    initHomePopup();
  </script>
</body>
</html>
